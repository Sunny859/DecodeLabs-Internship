<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Storefront - E-commerce Catalog</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f5f7;
      margin: 0;
      padding: 30px;
    }
    .header {
      max-width: 1000px;
      margin: 0 auto 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; color: #1e293b; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .tag {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      width: fit-content;
      margin-bottom: 12px;
    }
    .title { font-size: 18px; font-weight: 600; margin: 0 0 8px; color: #0f172a; }
    .desc { font-size: 14px; color: #64748b; line-height: 1.5; margin: 0 0 16px; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #f1f5f9;
      padding-top: 14px;
    }
    .price { font-size: 20px; font-weight: 700; color: #059669; }
    .stock { font-size: 13px; font-weight: 500; color: #16a34a; }
    .out-stock { color: #dc2626; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Product Catalog</h1>
    <span id="product-count" style="color: #64748b; font-size: 15px;">Loading...</span>
  </div>

  <div class="grid" id="product-grid"></div>

  <script>
    async function loadProducts() {
      try {
        const res = await fetch('/api/v1/products');
        const data = await res.json();
        const grid = document.getElementById('product-grid');
        const count = document.getElementById('product-count');

        if (data.status === 'success') {
          const products = data.data.products;
          count.innerText = `${products.length} Products Available`;

          grid.innerHTML = products.map(p => `
            <div class="card">
              <div>
                <span class="tag">${p.category ? p.category.name : 'General'}</span>
                <h3 class="title">${p.name}</h3>
                <p class="desc">${p.description}</p>
              </div>
              <div class="footer">
                <span class="price">$${p.price.toFixed(2)}</span>
                <span class="stock ${p.inStock ? '' : 'out-stock'}">
                  ${p.inStock ? '● In Stock' : '○ Out of Stock'}
                </span>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        document.getElementById('product-count').innerText = 'Failed to load catalog';
      }
    }

    loadProducts();
  </script>
</body>
</html>
